name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Alle Module bauen
        run: npm run build -- --out "$RUNNER_TEMP/dist"  # außerhalb des Repos, wie im Release
      - name: Index-Datei prüfen
        run: npx tsx packages/module-sdk/src/cli.ts check-index matchdesk-source.json

  agent:
    name: Windows-Agent („Spielt gerade“) testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/presence/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: modules/presence/agent/go.mod
          cache-dependency-path: modules/presence/agent/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && GOOS=windows GOARCH=amd64 go vet ./...
      - run: go test -race ./...

  # Exe und Installer wie im Release, unsigniert. Das Artefakt „agent-assets“ zum Ausprobieren.
  agent-installer:
    name: Windows-Agent („Spielt gerade“) bauen
    uses: ./.github/workflows/agent-windows.yml
    with:
      module: presence
