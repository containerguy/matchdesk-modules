name: Modul veröffentlichen

# Ein Tag <modul>-v<version> (z. B. hallo-v1.0.0) baut das Modul, hängt das Paket an ein
# GitHub-Release und trägt es mit Prüfsumme in matchdesk-source.json auf main ein.
# Alternativ unter Actions › „Modul veröffentlichen“ › „Run workflow“ den Tag eintragen;
# dann legt die Pipeline den Tag auf dem gewählten Branch (main) selbst an.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag <modul>-v<version>, z. B. hallo-v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: modul-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag prüfen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      module: ${{ steps.tag.outputs.module }}
      version: ${{ steps.tag.outputs.version }}
      agent: ${{ steps.agent.outputs.present }}
    steps:
      - name: Tag zerlegen
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^([a-z][a-z0-9]{1,31})-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Tag $TAG hat nicht das Format <modul>-v<version>" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "module=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      # Module mit Windows-Agent (agent/go.mod, z. B. „Spielt gerade“) bekommen den Installer
      # unter assets/ ins Paket.
      - name: Agent vorhanden?
        id: agent
        run: |
          if [ -f "modules/${{ steps.tag.outputs.module }}/agent/go.mod" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  agent:
    name: Windows-Agent
    needs: prepare
    if: needs.prepare.outputs.agent == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/agent-windows.yml
    with:
      module: ${{ needs.prepare.outputs.module }}
      version: ${{ needs.prepare.outputs.version }}
      sign: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    needs: [prepare, agent]
    if: always() && needs.prepare.result == 'success' && (needs.agent.result == 'success' || needs.agent.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      MODULE: ${{ needs.prepare.outputs.module }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Agent-Installer ins Paket legen
        if: needs.prepare.outputs.agent == 'true'
        uses: actions/download-artifact@v4
        with:
          name: agent-assets
          path: modules/${{ needs.prepare.outputs.module }}/assets

      - name: Modul bauen
        run: |
          test -f "modules/$MODULE/module.json"
          npx tsx packages/module-sdk/src/cli.ts release "modules/$MODULE" \
            --expect-version "$VERSION" --out "$RUNNER_TEMP/dist"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$RUNNER_TEMP/dist/$MODULE-$VERSION.tgz"
          gh release create "$TAG" "$FILE" "$FILE.sha256" --target "$GITHUB_SHA" \
            --title "$MODULE $VERSION" \
            --notes "Modul $MODULE $VERSION für Matchdesk (matchdeskApi 1). Installieren unter Admin › Module."

      - name: Index-Datei auf main aktualisieren
        run: |
          git fetch origin main
          git checkout -B main origin/main
          npx tsx packages/module-sdk/src/cli.ts index-add \
            "$RUNNER_TEMP/dist/$MODULE-$VERSION.tgz" \
            --index matchdesk-source.json \
            --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchdesk-source.json
          git commit -m "Index: $MODULE $VERSION"
          git push origin main
